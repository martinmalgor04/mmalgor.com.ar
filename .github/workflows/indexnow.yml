name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    name: Avisar a Bing y ChatGPT Search
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Esperar el deploy y notificar URLs
        run: node scripts/indexnow.mjs
