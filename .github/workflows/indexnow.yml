name: IndexNow

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

jobs:
  notify:
    name: Avisar a Bing y ChatGPT Search
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Esperar el deploy de Vercel y leer el sitemap vivo
        run: sleep 90 && node scripts/indexnow.mjs
