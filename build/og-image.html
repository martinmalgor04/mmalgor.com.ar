<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>OG image — mmalgor.com.ar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=block">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(135deg, #0A1929 0%, #0F2238 60%, #102A43 100%);
    position: relative;
    color: #fff;
  }

  .topbar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 10px; background: #2196F3;
  }

  .rings {
    position: absolute;
    top: -260px; right: -300px;
    width: 1000px; height: 1000px;
  }

  .inner {
    position: relative;
    height: 100%;
    padding: 78px 80px 72px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .eyebrow {
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #2196F3;
    margin-bottom: 26px;
  }

  h1 {
    font-weight: 800;
    font-size: 62px;
    line-height: 1.06;
    letter-spacing: -1.6px;
    max-width: 900px;
  }
  .highlight { color: #2196F3; }

  .name {
    margin-top: 40px;
    padding-top: 30px;
    border-top: 1px solid rgba(255,255,255,0.16);
    display: flex;
    align-items: baseline;
    gap: 20px;
  }
  .name strong {
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -0.3px;
    color: #fff;
  }
  .name span {
    font-weight: 400;
    font-size: 22px;
    color: rgba(255,255,255,0.65);
  }

  .url {
    position: absolute;
    right: 80px; bottom: 72px;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 1px;
    color: #A2C6D4;
  }
</style>
</head>
<body>

<div class="topbar"></div>

<svg class="rings" viewBox="0 0 900 900" aria-hidden="true">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A2C6D4" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#A2C6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="450" cy="450" r="440" fill="url(#g)"/>
  <circle cx="450" cy="450" r="200" fill="none" stroke="#A2C6D4" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="450" cy="450" r="300" fill="none" stroke="#A2C6D4" stroke-opacity="0.07" stroke-width="2"/>
  <circle cx="450" cy="450" r="400" fill="none" stroke="#A2C6D4" stroke-opacity="0.06" stroke-width="2"/>
</svg>

<div class="inner">
  <p class="eyebrow">Director de Servicios &amp; Sistemas · Corrientes, Argentina</p>
  <h1>Traduzco tecnología a<br><span class="highlight">decisiones de negocio.</span></h1>
  <div class="name">
    <strong>Martín Malgor</strong>
    <span>Estrategia IT para PYMES del NEA</span>
  </div>
</div>

<p class="url">mmalgor.com.ar</p>

</body>
</html>
