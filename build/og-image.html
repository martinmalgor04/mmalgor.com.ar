<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>OG image — mmalgor.com.ar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #000;
    position: relative;
    color: #f5f5f7;
  }
  .aurora {
    position: absolute;
    left: 50%;
    top: -8%;
    width: 980px;
    height: 640px;
    transform: translateX(-50%);
    background:
      radial-gradient(ellipse 55% 60% at 50% 20%, rgba(33, 150, 243, 0.18) 0%, transparent 65%),
      radial-gradient(ellipse 40% 45% at 65% 10%, rgba(162, 198, 212, 0.12) 0%, transparent 70%);
  }
  .inner {
    position: relative;
    height: 100%;
    padding: 78px 80px 72px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .eyebrow {
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.02em;
    color: #98989d;
    margin-bottom: 22px;
  }
  h1 {
    font-weight: 800;
    font-size: 58px;
    line-height: 1.08;
    letter-spacing: -1.6px;
    max-width: 920px;
  }
  .highlight { color: #a2c6d4; }
  .name {
    margin-top: 40px;
    padding-top: 28px;
    border-top: 1px solid rgba(255,255,255,0.12);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .name strong {
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -0.3px;
  }
  .name span {
    font-weight: 400;
    font-size: 20px;
    color: #98989d;
    max-width: 46ch;
  }
  .url {
    position: absolute;
    right: 80px;
    bottom: 72px;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.04em;
    color: #a2c6d4;
  }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="inner">
  <p class="eyebrow" data-role></p>
  <h1 data-tagline></h1>
  <div class="name">
    <strong data-name></strong>
    <span data-line></span>
  </div>
</div>
<p class="url">mmalgor.com.ar</p>
</body>
</html>
