<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Banner LinkedIn — mmalgor.com.ar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1584px; height: 396px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #000;
    position: relative;
    color: #f5f5f7;
    -webkit-font-smoothing: antialiased;
  }
  .aurora {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 34% 90% at 62% 0%, rgba(33, 150, 243, 0.22) 0%, transparent 70%),
      radial-gradient(ellipse 28% 80% at 84% 100%, rgba(162, 198, 212, 0.10) 0%, transparent 70%),
      radial-gradient(ellipse 30% 70% at 10% 110%, rgba(0, 113, 227, 0.16) 0%, transparent 70%);
  }
  .hairline {
    position: absolute; left: 0; right: 0; bottom: 0; height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(33,150,243,0.5) 45%, rgba(162,198,212,0.35) 70%, transparent 100%);
  }
  /* La foto de perfil de LinkedIn tapa el ángulo inferior izquierdo: todo empieza a la derecha de eso. */
  .inner {
    position: absolute; left: 430px; top: 0; bottom: 0; right: 400px;
    display: flex; flex-direction: column; justify-content: center;
    padding-bottom: 6px;
  }
  .eyebrow {
    font-weight: 600; font-size: 17px; letter-spacing: 0.05em; text-transform: uppercase;
    color: #2196f3; margin-bottom: 18px;
  }
  h1 {
    font-weight: 800; font-size: 58px; line-height: 1.06; letter-spacing: -1.7px;
    max-width: 760px;
  }
  .highlight { color: #a2c6d4; }
  .line {
    margin-top: 22px; font-size: 20px; letter-spacing: -0.1px; color: #98989d;
    display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; max-width: 720px;
  }
  .line span { white-space: nowrap; }
  .line .row { display: flex; align-items: center; gap: 14px; }
  .line i { width: 4px; height: 4px; border-radius: 50%; background: #48484a; display: inline-block; }
  .side {
    position: absolute; right: 72px; top: 0; bottom: 0; width: 300px;
    display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 30px;
    padding-bottom: 6px;
  }
  .url {
    font-weight: 600; font-size: 21px; letter-spacing: 0.04em; color: #a2c6d4;
  }
  .marks { display: flex; flex-direction: column; align-items: flex-end; gap: 16px; }
  .marks img { display: block; opacity: 0.92; }
  .marks .tango { height: 64px; filter: drop-shadow(0 0 22px rgba(33,150,243,0.35)); }
  .marks .row { display: flex; gap: 22px; align-items: center; opacity: 0.55; }
  .marks .utn { height: 26px; }
  .marks .spacex { height: 12px; }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="hairline" aria-hidden="true"></div>
<div class="inner">
  <p class="eyebrow" data-name></p>
  <h1 data-tagline></h1>
  <p class="line" data-parts></p>
</div>
<div class="side">
  <div class="marks">
    <img class="tango" src="../public/brands/tango-elite.webp" alt="">
    <div class="row">
      <img class="utn" src="../public/brands/utn-wordmark-white.png" alt="">
      <img class="spacex" src="../public/brands/spacexai-wordmark-white.png" alt="">
    </div>
  </div>
  <p class="url">mmalgor.com.ar</p>
</div>
</body>
</html>
